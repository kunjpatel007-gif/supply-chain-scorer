<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ risk_level }} Risk Sellers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --void: #06070a;
            --panel: #0d0f15;
            --hairline: #1e222c;
            --hairline-soft: rgba(255,255,255,0.05);
            --text-1: #eef1f6;
            --text-2: #8a93a6;
            --text-3: #4a5163;
            --accent: #7c8cff;
            --accent-dim: rgba(124,140,255,0.10);
            --risk-high: #ff5252;
            --risk-high-dim: rgba(255,82,82,0.12);
            --risk-med: #ffb142;
            --risk-med-dim: rgba(255,177,66,0.12);
            --risk-low: #33d9b2;
            --risk-low-dim: rgba(51,217,178,0.12);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
        }

        body { font-family: var(--font-body); background: var(--void); color: var(--text-1); line-height: 1.5; -webkit-font-smoothing: antialiased; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0); background-size: 26px 26px; min-height: 100vh; position: relative; }
        body::before { content: ""; position: fixed; top: -220px; left: 50%; transform: translateX(-50%); width: 900px; height: 420px; background: radial-gradient(ellipse at center, var(--accent-dim), transparent 72%); pointer-events: none; z-index: 0; }
        :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }
        
        .navbar { background: rgba(6,7,10,0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--hairline); padding: 0 48px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .navbar-brand { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: #fafafa; display: flex; align-items: center; gap: 10px; }
        .mark { width: 12px; height: 12px; position: relative; flex-shrink: 0; }
        .mark::before, .mark::after { content: ""; position: absolute; width: 5px; height: 5px; border: 1.4px solid var(--accent); }
        .mark::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
        .mark::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }
        .mark span { position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; background: var(--accent); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 6px 1px var(--accent); }
        .back-link { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); text-decoration: none; font-weight: 500; letter-spacing: 0.3px; transition: color 0.15s; }
        .back-link:hover { color: #fafafa; }

        .container { max-width: 800px; margin: 0 auto; padding: 52px 24px; position: relative; z-index: 1; }
        .header { margin-bottom: 32px; display: flex; align-items: baseline; gap: 12px; }
        .header h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: #fafafa; letter-spacing: -0.4px; }
        
        .badge { display: inline-block; padding: 3px 9px; border-radius: 4px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
        .badge-high { background: var(--risk-high-dim); color: var(--risk-high); }
        .badge-medium { background: var(--risk-med-dim); color: var(--risk-med); }
        .badge-low { background: var(--risk-low-dim); color: var(--risk-low); }
        
        .results-list { background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; }
        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 17px 22px; border-bottom: 1px solid var(--hairline-soft); text-decoration: none; border-left: 2px solid transparent; transition: background 0.15s, border-color 0.15s; }
        .result-item:last-child { border-bottom: none; }
        .result-item:hover { background: rgba(124,140,255,0.045); border-left-color: var(--accent); }

        .r-name { font-size: 14px; font-weight: 600; color: #fafafa; margin-bottom: 3px; }
        .r-id { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
        .r-metrics { display: flex; align-items: center; gap: 16px; }
        .r-score { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--text-1); }
        .r-arrow { color: var(--text-3); }

        .result-count { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); margin-top: 18px; text-align: center; letter-spacing: 0.3px; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand"><span class="mark"><span></span></span>Vendor Risk Intelligence</div>
    <a href="{{ url_for('index') }}" class="back-link">← DASHBOARD</a>
</nav>

<div class="container">
    <div class="header">
        <h1>{{ risk_level }} Risk Sellers</h1>
        <span class="badge {% if risk_level == 'High' %}badge-high{% elif risk_level == 'Medium' %}badge-medium{% else %}badge-low{% endif %}">{{ results|length }} total</span>
    </div>

    <div class="results-list">
        {% for r in results %}
        <a href="{{ url_for('seller', seller_id=r[0]) }}" class="result-item">
            <div>
                <div class="r-name">{{ r[1] }}</div>
                <div class="r-id">{{ r[0] }}</div>
            </div>
            <div class="r-metrics">
                <span class="r-score">{{ "%.1f"|format(r[2]) }}</span>
                <span class="badge {% if r[3] == 'High' %}badge-high{% elif r[3] == 'Medium' %}badge-medium{% else %}badge-low{% endif %}">{{ r[3]|upper }}</span>
                <span class="r-arrow">→</span>
            </div>
        </a>
        {% endfor %}
        
        {% if not results %}
        <div style="padding: 40px; text-align: center; color: var(--text-3); font-family: var(--font-mono); font-size: 12px;">
            No sellers found in this category.
        </div>
        {% endif %}
    </div>
</div>

</body>
</html>
