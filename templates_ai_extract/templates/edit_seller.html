{% extends "base.html" %}
{% block title %}Edit Seller | NexusRisk{% endblock %}
{% block actions %}<a class="pill" href="{{ url_for('sellers.seller', seller_id=seller_id) }}">Cancel</a>{% endblock %}
{% block content %}
<div class="narrow">
    <div class="head rise"><h1>{{ seller.sellerName }}</h1></div>
    <div class="glass rise" style="--i:1;padding:2rem">
        <form method="POST">
            <div class="grp"><label>Company name</label><input type="text" name="name" value="{{ seller.sellerName }}" required autofocus></div>
            <div class="grp"><label>City</label><input type="text" name="city" value="{{ seller.sellerCity }}"></div>
            <div class="grp"><label>State</label><input type="text" name="state" value="{{ seller.sellerState }}"></div>
            <button type="submit" class="btn"><svg class="i" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Save changes</button>
        </form>
        <form method="POST" action="{{ url_for('sellers.delete_seller', seller_id=seller_id) }}" data-c="Delete {{ seller.sellerName }}?" onsubmit="return confirm(this.dataset.c)" style="margin-top:.75rem">
            <button type="submit" class="btn danger">Delete seller</button>
        </form>
    </div>
</div>
{% endblock %}
