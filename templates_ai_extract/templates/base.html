<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NexusRisk{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@view-transition{navigation:auto}
@property --s{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{--bg:#090b10;--ink:#e8eaf0;--mute:#8b93a5;--line:rgba(255,255,255,.08);--glass:rgba(255,255,255,.04);--acc:#8fb4ff;--hi:#ff5d73;--md:#f5a524;--lo:#3ddc97;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Geist,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
main{max-width:1200px;margin:0 auto;padding:2.5rem 1.5rem 5rem}
.narrow{max-width:520px;margin:0 auto}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.high,.High{--c:var(--hi)}.medium,.Medium{--c:var(--md)}.low,.Low{--c:var(--lo)}

/* ambient field */
.field{position:fixed;inset:0;z-index:-1;overflow:hidden}
.field::before,.field::after{content:"";position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);animation:drift 26s ease-in-out infinite alternate;transition:background 1s}
.field::before{background:#3b5bdb;opacity:.32;top:-32vmax;left:-12vmax}
.field::after{background:#0ea5a4;opacity:.16;bottom:-36vmax;right:-16vmax;animation-delay:-9s}
body.high .field::before,body.High .field::before{background:var(--hi)}
body.medium .field::before,body.Medium .field::before{background:var(--md)}
body.low .field::before,body.Low .field::before{background:var(--lo)}

/* motion */
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fill{to{--s:var(--score)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(min(var(--i,0),12)*55ms)}

/* nav */
.bar{position:sticky;top:14px;z-index:20;display:flex;justify-content:space-between;align-items:center;width:calc(100% - 2rem);max-width:1200px;margin:14px auto 0;padding:.5rem .5rem .5rem 1.1rem;border:1px solid var(--line);border-radius:999px;background:rgba(14,17,24,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);view-transition-name:bar}
.brand{display:flex;gap:.55rem;align-items:center;font-weight:600;letter-spacing:-.01em}
.brand .i{color:var(--acc)}
.bar nav{display:flex;gap:.3rem}
.pill{display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .9rem;border-radius:999px;font-size:.875rem;color:var(--mute);transition:color .25s,background .25s}
.pill:hover{color:var(--ink);background:var(--glass)}
.pill.on{background:var(--ink);color:#0a0c11;font-weight:500}
.pill.on:hover{background:#fff}

/* type + layout */
h1{font-size:clamp(1.8rem,3vw,2.4rem);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.sub,.mute{color:var(--mute)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:1.5rem;flex-wrap:wrap;margin-bottom:2rem}
.sec{font-size:.9rem;font-weight:500;color:var(--mute);margin:2.5rem 0 1rem}
.num{font-size:2.6rem;font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.mono,.id{font-family:'Geist Mono',monospace;font-size:.78rem;color:var(--mute)}
.text-coral{color:var(--hi)}.text-emerald{color:var(--lo)}.text-amber{color:var(--md)}.text-neutral{color:var(--mute)}

/* glass */
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:1.5rem;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),rgba(143,180,255,.13),transparent 70%)}
.glass:hover::before{opacity:1}
.glass>*{position:relative}
a.glass:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18)}

/* risk atoms */
.badge{display:inline-flex;align-items:center;gap:.45rem;padding:.2rem .7rem;border-radius:999px;font-size:.75rem;font-weight:500;color:var(--c,var(--mute));background:color-mix(in srgb,var(--c,#888) 14%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--mute))}
.badge.high::before,.badge.High::before{animation:pulse 2s infinite}
.track{height:4px;width:96px;margin-top:.45rem;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.fill{height:100%;background:var(--c,var(--acc));border-radius:4px;transform-origin:left;animation:grow 1.1s .3s cubic-bezier(.2,.7,.2,1) both}

/* forms */
label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:.4rem}
.grp{margin-bottom:1.25rem}
input,select,textarea{width:100%;padding:.8rem 1rem;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;outline:0;transition:border-color .25s,box-shadow .25s,background .25s}
textarea{min-height:140px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(143,180,255,.12);background:rgba(255,255,255,.06)}
select option{background:#12151c}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.85rem 1.2rem;border:0;border-radius:12px;background:var(--ink);color:#0a0c11;font:500 .95rem Geist,sans-serif;cursor:pointer;transition:transform .2s,box-shadow .3s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px -10px rgba(143,180,255,.6)}
.btn:active{transform:scale(.98)}
.btn.sm{width:auto;margin-top:1.2rem}
.btn.danger{background:transparent;color:var(--hi);border:1px solid color-mix(in srgb,var(--hi) 35%,transparent)}
.busy .btn{pointer-events:none;opacity:.7}
.busy .btn::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.flash{padding:.8rem 1rem;margin-bottom:1rem;border-radius:12px;font-size:.9rem;background:rgba(143,180,255,.1);border:1px solid rgba(143,180,255,.25);animation:rise .5s both}
.flash.err{background:color-mix(in srgb,var(--hi) 12%,transparent);border-color:color-mix(in srgb,var(--hi) 30%,transparent);color:#ffb3bd}

/* lists */
.list{display:grid;gap:.6rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem 1.3rem}
.row b{font-weight:500;display:block}
.meta{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:.82rem;margin-top:.35rem}
.score{font-size:1.4rem;font-weight:500;color:var(--c,var(--ink));font-variant-numeric:tabular-nums}
.end{display:flex;align-items:center;gap:1.2rem}
.go{color:var(--mute);transition:transform .3s,color .3s}
a:hover>.go,a:hover .go{transform:translateX(4px);color:var(--ink)}
.count{display:inline-grid;place-items:center;min-width:2rem;height:2rem;padding:0 .6rem;border-radius:999px;font-size:.85rem;color:var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 14%,transparent)}
.empty{text-align:center;padding:5rem 1rem;color:var(--mute)}
.empty h3{color:var(--ink);font-weight:500;font-size:1.2rem}

@media(max-width:700px){main{padding:2rem 1rem 4rem}.pill span{display:none}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}.gauge{--s:var(--score)}}
</style>
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="field"></div>
{% block nav %}
<header class="bar rise">
    <a class="brand" href="{{ url_for('dashboard.index') }}"><svg class="i" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>NexusRisk</a>
    <nav>{% block actions %}{% endblock %}</nav>
</header>
{% endblock %}
<main>{% block content %}{% endblock %}</main>
<script>
(()=>{const d=document;
d.querySelectorAll('[data-n]').forEach(e=>{const t=parseFloat(e.textContent);if(isNaN(t)||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const p=(e.textContent.split('.')[1]||'').length,s=performance.now();(function f(n){const k=Math.min((n-s)/900,1);e.textContent=(t*(1-Math.pow(1-k,3))).toFixed(p);if(k<1)requestAnimationFrame(f)})(s)});
d.addEventListener('pointermove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}});
d.addEventListener('submit',e=>e.target.classList.add('busy'));
addEventListener('pageshow',()=>d.querySelectorAll('.busy').forEach(f=>f.classList.remove('busy')));
})();
</script>
</body>
</html>
