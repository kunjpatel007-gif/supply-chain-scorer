{% extends "base.html" %}
{% block preload %}<link rel="preload" href="{{ asset('fonts/instrument-serif-latin-400-italic.woff2') }}" as="font" type="font/woff2" crossorigin>{% endblock %}
{% block title %}Sign in · NexusRisk{% endblock %}
{% block bar %}{% endblock %}
{% block content %}
<section style="min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:80px">
  <div class="rise">
    <div class="eyebrow">NexusRisk</div>
    <h1 class="display chars" style="margin-top:18px;font-size:clamp(56px,7vw,96px)">Supplier <i>risk</i>,<br>scored monthly.</h1>
  </div>
  <form method="POST" class="rise" style="--i:2;max-width:380px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if error %}<div class="flash err" style="margin:0 0 24px">{{ error }}</div>{% endif %}
    <label class="field"><span class="eyebrow">Admin password</span><input type="password" name="password" required autofocus></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
