{% extends "base.html" %}
{% block title %}Edit {{ seller.sellerName }} · NexusRisk{% endblock %}
{% block content %}
<section class="head"><div class="rise"><div class="eyebrow mono" style="text-transform:none;letter-spacing:0">{{ seller_id }}</div><h1 class="display" style="margin-top:14px">{{ seller.sellerName }}</h1></div></section>
<section class="sec" style="max-width:560px">
  <form method="POST" class="rise" style="--i:1">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span class="eyebrow">Name</span><input type="text" name="name" required value="{{ seller.sellerName }}"></label>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px">
      <label class="field"><span class="eyebrow">City</span><input type="text" name="city" value="{{ seller.sellerCity or '' }}"></label>
      <label class="field"><span class="eyebrow">State</span><input type="text" name="state" maxlength="2" value="{{ seller.sellerState or '' }}"></label>
    </div>
    <div style="display:flex;gap:12px"><button class="btn" type="submit">Save</button><a class="btn ghost" href="{{ url_for('sellers.seller', seller_id=seller_id) }}">Cancel</a></div>
  </form>
  <div style="margin-top:48px;padding-top:28px;border-top:1px solid var(--line)">
    <div class="eyebrow" style="margin-bottom:14px">Deleting shows everything that goes with it first</div>
    <a class="btn danger" href="{{ url_for('data.remove', table='sellers', doc_id=seller_id) }}">Delete seller…</a>
  </div>
</section>
{% endblock %}
