{% extends "base.html" %}
{% block title %}Simulate Event | NexusRisk{% endblock %}
{% block actions %}<a class="pill" href="{{ url_for('dashboard.index') }}">Cancel</a>{% endblock %}
{% block content %}
<div class="narrow">
    <div class="head rise"><h1>Simulate event</h1></div>

    <div class="glass rise" style="--i:1;padding:2rem">
        <form method="POST" action="{{ url_for('simulator.simulate_event') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="grp">
                <label>Target Seller (Type to Search)</label>
                <input list="seller_options" name="seller_id" id="seller_input" placeholder="Search by Seller ID or Name..." required>
                <datalist id="seller_options">
                    {% for seller in sellers %}
                        <option value="{{ seller.id }}">{{ seller.name }}</option>
                    {% endfor %}
                </datalist>
            </div>
            <div class="grp"><label>Delay (days)</label><input type="number" name="delay_days" min="0" max="365" required></div>
            <div class="grp"><label>Review notes</label><textarea name="review_text" maxlength="2000" required placeholder="Write it in English, e.g. Arrived broken, terrible quality"></textarea></div>
            <button type="submit" class="btn"><svg class="i" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Run analysis and inject</button>
        </form>
    </div>
</div>
{% endblock %}
