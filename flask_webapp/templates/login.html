{% extends "base.html" %}
{% block title %}Login | NexusRisk{% endblock %}
{% block head %}<style>main{min-height:100vh;display:grid;place-items:center;padding-top:1.5rem}.box{width:100%;max-width:380px;padding:2rem}.box .brand{justify-content:center;margin-bottom:1.75rem;font-size:1.25rem}</style>{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="glass box rise">
    <div class="brand"><svg class="i" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>NexusRisk</div>

    {% if error %}
    <div class="flash err">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="grp"><input type="password" name="password" placeholder="Password" required autofocus></div>
        <button type="submit" class="btn">Sign in</button>
    </form>
</div>
{% endblock %}
