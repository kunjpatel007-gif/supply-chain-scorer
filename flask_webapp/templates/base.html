<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NexusRisk Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Surface Depths */
            --surface-canvas: #0d0e11;
            --surface-subtle: #131519;
            --surface-card: #17191e;
            --surface-well: #1e2027;
            --surface-card-hover: #24262d;
            --surface-rail: #111318;
            
            /* Hairline Framing */
            --border-subtle: #2a2d36;
            --border-muted: #353842;
            --border-highlight: rgba(255, 255, 255, 0.06);
            --border-shadow: rgba(0, 0, 0, 0.4);
            
            /* Instrument Accents */
            --accent-amber: #d97736;
            --accent-amber-hover: #e0833a;
            --accent-glow: 0 0 12px rgba(217, 119, 54, 0.15);
            --accent-red: #ef4444;
            --accent-red-glow: 0 0 12px rgba(239, 68, 68, 0.5);
            --accent-green: #22c55e;
            
            /* Text */
            --text-main: #f4f4f6;
            --text-muted: #9da2af;
            --text-subtle: #686d7c;

            /* Shadows */
            --shadow-well: inset 0 1px 3px rgba(0, 0, 0, 0.5);
            --shadow-chassis: 0 1px 3px rgba(0, 0, 0, 0.4), inset 0 1px 0 var(--border-highlight);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--surface-canvas);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 { font-family: 'Chivo', sans-serif; letter-spacing: -0.02em; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* App Layout */
        .app-layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            width: 100%;
        }

        /* Sidebar Rail */
        .sidebar-rail {
            background: var(--surface-rail);
            border-right: 1px solid var(--border-subtle);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .brand {
            font-family: 'Chivo', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-amber);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--surface-card-hover);
            color: var(--text-main);
            border: 1px solid var(--border-muted);
        }

        .canvas-area {
            padding: 2rem 3rem;
            overflow-y: auto;
            height: 100vh;
        }

        /* UI Components */
        .panel-chassis {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-chassis);
            border-radius: 4px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .metric-well {
            background: var(--surface-well);
            box-shadow: var(--shadow-well);
            border: 1px solid var(--border-muted);
            border-radius: 4px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .metric-value {
            font-size: 2.5rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
            line-height: 1;
        }
        
        .metric-label {
            color: var(--text-subtle);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* Forms */
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        input, select, textarea {
            width: 100%;
            background: var(--surface-subtle);
            border: 1px solid var(--border-muted);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-amber);
            box-shadow: var(--accent-glow);
        }

        /* Buttons */
        .btn-instrument {
            background: var(--accent-amber);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 2px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-instrument:hover {
            background: var(--accent-amber-hover);
            box-shadow: var(--accent-glow);
        }
        
        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-muted);
            padding: 0.75rem 1.5rem;
            border-radius: 2px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-outline:hover {
            background: var(--surface-card-hover);
            border-color: var(--text-muted);
        }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { 
            text-align: left; 
            padding: 1rem; 
            background: var(--surface-subtle);
            color: var(--text-subtle);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-subtle);
        }
        td { 
            padding: 1rem; 
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-muted);
        }
        tr:hover td { background: var(--surface-card-hover); }
        
        .status-orb {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }
        .status-orb.high { background: var(--accent-red); box-shadow: var(--accent-red-glow); }
        .status-orb.medium { background: var(--accent-amber); box-shadow: var(--accent-glow); }
        .status-orb.low { background: var(--accent-green); }

        .flash-messages {
            margin-bottom: 1.5rem;
        }
        .flash {
            background: rgba(217, 119, 54, 0.1);
            border-left: 3px solid var(--accent-amber);
            padding: 1rem;
            color: var(--text-main);
            border-radius: 2px;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar-rail">
            <div class="brand">NexusRisk</div>
            <nav class="nav-menu">
                <a href="{{ url_for('dashboard.index') }}" class="nav-item">Dashboard</a>
                <a href="{{ url_for('simulator.simulate_event') }}" class="nav-item">Live Simulator</a>
                <a href="{{ url_for('sellers.add_seller') }}" class="nav-item">Add Seller</a>
            </nav>
            <div style="margin-top: auto;">
                {% if session.get('logged_in') %}
                    <a href="{{ url_for('auth.logout') }}" class="nav-item" style="color: var(--accent-red); font-size: 0.875rem;">Logout System</a>
                {% endif %}
            </div>
        </aside>
        <main class="canvas-area">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for message in messages %}
                            <div class="flash">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
