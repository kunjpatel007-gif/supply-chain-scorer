<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Seller</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #f3f4f6; padding: 2rem; }
        .form-box { max-width: 400px; margin: 0 auto; background: rgba(255, 255, 255, 0.03); padding: 2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #333; background: #111; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 0.8rem; background: #8b5cf6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 1rem; }
        .delete-btn { background: rgba(255,107,107,0.2); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.5); }
        a { color: #9ca3af; text-decoration: none; display: block; text-align: center; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Edit Seller: {{ seller_id }}</h2>
        <form method="POST" action="{{ url_for('edit_seller', seller_id=seller_id) }}">
            <input type="text" name="name" value="{{ seller.get('SellerName', '') }}" required>
            <input type="text" name="city" value="{{ seller.get('SellerCity', '') }}" required>
            <input type="text" name="state" value="{{ seller.get('SellerState', '') }}" required>
            <button type="submit">Update Seller</button>
        </form>
        <form method="POST" action="{{ url_for('delete_seller', seller_id=seller_id) }}" onsubmit="return confirm('Are you sure?');">
            <button type="submit" class="delete-btn">Delete Seller</button>
        </form>
        <a href="{{ url_for('seller', seller_id=seller_id) }}">Cancel</a>
    </div>
</body>
</html>
