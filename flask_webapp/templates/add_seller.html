<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Seller</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #f3f4f6; padding: 2rem; }
        .form-box { max-width: 400px; margin: 0 auto; background: rgba(255, 255, 255, 0.03); padding: 2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #333; background: #111; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 0.8rem; background: #8b5cf6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        a { color: #9ca3af; text-decoration: none; display: block; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Add Seller</h2>
        <form method="POST">
            <input type="text" name="seller_id" placeholder="Seller ID (e.g. S123)" required>
            <input type="text" name="name" placeholder="Seller Name" required>
            <input type="text" name="city" placeholder="City" required>
            <input type="text" name="state" placeholder="State" required>
            <button type="submit">Save Seller</button>
        </form>
        <a href="{{ url_for('dashboard.index') }}">Cancel</a>
    </div>
</body>
</html>
